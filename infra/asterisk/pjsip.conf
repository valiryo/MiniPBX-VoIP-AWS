[global]
type = global
user_agent = MiniPBX-Lab
endpoint_identifier_order = username

[transport-udp]
type = transport
protocol = udp
; Dentro do container. No Windows, Compose publica apenas em 127.0.0.1.
bind = 0.0.0.0:5060
; Perfil exclusivo para softphones no MESMO Windows via Docker Desktop.
local_net = 127.0.0.0/8
external_signaling_address = 127.0.0.1
external_signaling_port = 5060

[phone](!)
type = endpoint
transport = transport-udp
disallow = all
allow = ulaw,alaw
direct_media = no
media_address = 127.0.0.1
bind_rtp_to_media_address = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
ice_support = no
dtmf_mode = rfc4733
allow_transfer = no
allow_subscribe = no
allow_overlap = no
trust_id_inbound = no
rtp_timeout = 60

[1001](phone)
context = from-1001
auth = auth-1001
aors = 1001
callerid = Ramal 1001 <1001>

[1001]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30
default_expiration = 300
maximum_expiration = 600

[1002](phone)
context = from-1002
auth = auth-1002
aors = 1002
callerid = Ramal 1002 <1002>

[1002]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30
default_expiration = 300
maximum_expiration = 600

; Arquivo gerado localmente e ignorado pelo Git; nao existe senha padrao.
#include /run/secrets/sip-auth.conf
