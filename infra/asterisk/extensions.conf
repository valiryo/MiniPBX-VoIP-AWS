[general]
static = yes
writeprotect = yes
clearglobalvars = yes

[default]
; Sem destinos: qualquer discagem sera rejeitada.

[from-1001]
; Endpoint autenticado 1001 so pode ligar para 1002.
exten => 1002,1,NoOp(Chamada interna 1001 para 1002)
 same => n,Dial(PJSIP/1002,30,i)
 same => n,Hangup()

[from-1002]
; Endpoint autenticado 1002 so pode ligar para 1001.
exten => 1001,1,NoOp(Chamada interna 1002 para 1001)
 same => n,Dial(PJSIP/1001,30,i)
 same => n,Hangup()

; Sem includes ou padroes curinga: outros destinos e autochamadas nao existem.
; Opcao i: ignorar encaminhamento sugerido pelo telefone chamado.
