name: minipbx-local

services:
  asterisk:
    # Imagem comunitaria; versao e digest conferidos em 23/10/2026.
    image: andrius/asterisk:22.11.0_debian-trixie@sha256:d6333b8b331563c5887b98b12da9371ef48317e657d17d81770fe085f335041d
    user: asterisk
    entrypoint: ["/usr/sbin/asterisk"]
    command: ["-f", "-n", "-vv", "-T"]
    restart: "no"
    ports:
      - "127.0.0.1:5060:5060/udp"
      - "127.0.0.1:10000-10019:10000-10019/udp"
    volumes:
      # Oculta todos os exemplos da imagem; somente os dois ramais do projeto.
      - type: bind
        source: ./infra/asterisk
        target: /etc/asterisk
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/sip-auth.conf
        target: /run/secrets/sip-auth.conf
        read_only: true
        bind:
          create_host_path: false
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show channeltypes' | grep -q '^PJSIP ' && asterisk -rx 'pjsip show endpoints' | grep -q 'Objects found: 2'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
